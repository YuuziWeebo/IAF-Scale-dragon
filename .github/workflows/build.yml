name: Build addon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle --no-daemon build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: tamed-dragon-scaler-1.21.1-neoforge
          path: build/libs/*.jar
          if-no-files-found: error
